[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "admino"
version = "0.1.0"
description = "Local-only, security-first personal AI agent"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic>=2.10.6,<3",
    "pydantic-settings>=2.7.0,<3",
    "cryptography==50.0.2",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.166.0",
    "pyyaml==6.0.2",
    "asyncpg>=0.30.0,<1",
    # OpenAI SDK: used by the default Infomaniak provider (OpenAI-compatible API)
    # as well as the vLLM and OpenAI providers.
    "openai>=1.50.0,<2",
    # Document conversion pipeline (GH-188, approved in the issue): pypdfium2 = PDF
    # text extraction and page rendering, python-docx = DOCX, openpyxl = XLSX
    # (read-only mode), Pillow = image decoding/re-encoding.
    "pypdfium2==5.14.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0,<1",
]
# The OpenAI SDK is a core dependency, so only the Anthropic SDK is optional.
all-providers = [
    "anthropic>=0.40.0,<1",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.11.2",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20241230",
    "asyncpg-stubs>=0.30.0",
    "anthropic>=0.40.0,<1",
    "openai>=1.50.0,<2",
]

# The build backend, locked in uv.lock so CI and the Docker build install it
# from the lock (hash-checked) and build admino with --no-build-isolation.
# Keep the version equal to build-system.requires above.
[dependency-groups]
build = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/admino"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# GH-188: pypdfium2 and openpyxl ship no py.typed marker (python-docx and Pillow do);
# stub packages are not approved, so their imports are treated as untyped.
module = ["pypdfium2", "pypdfium2.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/admino --cov-report=term-missing --cov-report=html"

[tool.uv]
# GH-289: a lock refresh never picks up a release younger than 7 days (supply-chain
# guard). A security bump names its packages below; see CONTRIBUTING.md,
# "Release waiting period".
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
# pypdfium2==5.14.0 (exact pin, approved in GH-188) was uploaded 2026-10-04 and has no
# older release that satisfies the pin. Remove at the next routine refresh (after 2026-10-11).
pypdfium2 = "2026-10-05T00:00:00Z"
