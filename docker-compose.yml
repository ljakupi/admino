# admino — Base Compose file (agent only)
#
# This file defines the agent container and the two Docker networks.
# It does NOT define any LLM backend — admino is provider-agnostic.
#
# Run modes:
#
#   1. Cloud provider (Anthropic / OpenAI)
#      No local LLM container needed. The agent reaches the provider's API
#      directly via the egress whitelist.
#        docker compose up -d
#
#   2. Self-hosted OpenAI-compatible server (e.g. a local vLLM — coming soon)
#      Set llm.provider to "openai" in config.yaml and point the OPENAI_BASE_URL
#      env var (see .env.example) at the server's endpoint. The server's host
#      must be reachable per the egress whitelist.
#
# The Makefile wraps these with `make docker-up` — see Makefile.

services:

  # --------------------------------------------------------------------------
  # postgres — Relational database. Internal network only: no published ports,
  # unreachable from the host or LAN. The agent reaches it at postgres:5432
  # over the internal bridge. For native `make run` development, the
  # docker-compose.dev.yml overlay publishes 127.0.0.1:5432 (see `make dev-db`).
  # Data persists in the named Docker volume "admino-pgdata" (survives
  # `down`/`up`; not visible in the repo tree — avoids the uid-999 bind-mount
  # permissions footgun on Linux). Reset with `docker volume rm admino-pgdata`.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: admino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: admino
      POSTGRES_USER: admino
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admino -d admino"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # --------------------------------------------------------------------------
  # agent — Python ASGI app. Serves HTTP on port 8000.
  # External access: whitelist-only egress via iptables.
  #   The agent is connected to BOTH networks:
  #     - internal: to reach the local LLM backend (when one is overlaid)
  #     - egress:   for whitelisted external calls (googleapis.com,
  #                 api.anthropic.com, api.openai.com, etc.)
  #   iptables rules in entrypoint.sh enforce the whitelist on the egress interface.
  # --------------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: admino-agent:local
    container_name: admino-agent
    restart: unless-stopped

    # NET_ADMIN is required for the entrypoint.sh iptables egress whitelist.
    # Without it the whitelist is skipped with a warning (acceptable for dev).
    cap_add:
      - NET_ADMIN

    # Bind to localhost only. For LAN/VPN access, change to "0.0.0.0:8000:8000"
    # or use a reverse proxy. Never expose directly on a public interface.
    # BEFORE widening this publish, enable token auth: uncomment AUTH_MODE=token
    # in .env and set AUTH_TOKEN — the default "vpn" auth mode trusts every
    # connection and is only safe while this stays on 127.0.0.1.
    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Docker embedded DNS resolver — used by entrypoint.sh to resolve
      # whitelisted hostnames before locking down egress.
      DOCKER_DNS_IP: "127.0.0.11"
      # The internal Docker bridge CIDR — allow all traffic within this range
      # so the agent can reach the local LLM backend without going through
      # the iptables whitelist. Covers Docker's full IPAM pool (172.16.0.0/12).
      # Override if your Docker daemon uses a custom "bip" or address pool.
      INTERNAL_NETWORK: "172.16.0.0/12"
      # Hard-fail if NET_ADMIN is absent and iptables whitelist cannot be applied.
      # Set to "false" ONLY for local development without Docker privileges.
      # Defaults to "true" for production safety; override via .env file.
      REQUIRE_EGRESS_WHITELIST: "${REQUIRE_EGRESS_WHITELIST:-true}"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: admino
      PG_DATABASE: admino

    volumes:
      # Internal state — persists across container restarts. These directories
      # are admino's own bookkeeping, NOT user-facing files, and are deliberately
      # kept outside the file tool's sandbox (/app/documents). The audit log in
      # particular must never be reachable by the files.* tool.
      - ./data/logs:/app/data/logs      # Append-only audit log (NDJSON)
      # OAuth refresh tokens live in PostgreSQL (Fernet-encrypted), not on disk.
      # Config is read-only — the agent reads but must never write config files
      - ./config:/app/config:ro
      # User workspace: ONLY ~/Downloads/admino is mounted.
      # The container cannot see any other host directory — Docker isolation
      # guarantees this independently of the files.py path validation.
      # Create ~/Downloads/admino before first run: mkdir -p ~/Downloads/admino
      - "${HOME}/Downloads/admino:/app/documents:rw"

    networks:
      # Internal bridge: communicates with the local LLM backend (if overlaid)
      - internal
      # Egress bridge: external calls, locked down by iptables in entrypoint.sh
      - egress

    # Resource limits: prevent runaway tool calls from
    # exhausting host memory and triggering the OOM killer.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# --------------------------------------------------------------------------
# Networks
#
# `internal` (internal: true): Docker blocks all external routing from this
#   bridge. Any local LLM backend overlaid from docker-compose.*.yml is
#   attached ONLY here — guaranteed zero external access regardless of
#   iptables state.
#
# `egress`: standard bridge with external routing. Only the agent is attached.
#   iptables rules in entrypoint.sh enforce the whitelist so the agent can
#   reach api.anthropic.com, googleapis.com, etc. but nothing else.
# --------------------------------------------------------------------------
networks:
  internal:
    name: admino-internal
    driver: bridge
    internal: true

  egress:
    name: admino-egress
    driver: bridge

# --------------------------------------------------------------------------
# Volumes
#
# `pgdata`: named Docker volume for Postgres data, not a host bind-mount.
#   Keeps the repo tree free of uid-999-owned files (Linux bind-mount
#   permissions footgun) and requires no `mkdir` step before first run.
# --------------------------------------------------------------------------
volumes:
  pgdata:
    name: admino-pgdata
