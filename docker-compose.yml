# admino — Base Compose file (agent + postgres + optional local vLLM)
#
# This file defines the core services: agent, postgres, and the vllm service
# (opt-in via the "vllm" profile). Networks and volumes are also defined here.
#
# Run modes:
#
#   1. Default — Infomaniak AI Services (Swiss-hosted, OpenAI-compatible API)
#      No local model container. Set INFOMANIAK_API_TOKEN in .env; the agent
#      reaches api.infomaniak.com through the egress whitelist.
#        make start       # postgres + agent (same as make docker-up)
#      Anthropic / OpenAI are cloud opt-ins reached the same way: set the API
#      key, whitelist the host, switch in Settings → Agent (or LLM_PROVIDER).
#
#   2. Opt-in local vLLM — CPU container (cross-platform: Apple Silicon + Linux)
#      The vllm service runs vllm/vllm-openai-cpu:latest, a multi-arch image
#      (arm64 + amd64). Docker auto-pulls the correct arch. No Metal, no host
#      process, nothing outside Docker.
#        make start-local # provisions the model (one-time ~8 GB), then brings up
#                         # postgres + agent + vllm (profile vllm activated)
#      Or individually:
#        make vllm-pull   # pre-download the model into the vllm-models volume
#        make vllm-up     # bring up just the vllm service
#        make vllm-down   # stop just the vllm service
#      Then pick the vLLM provider in Settings → Agent.
#      Note: Docker Desktop must have ~12–16 GB RAM allocated (default 8 GB is
#      not enough for a 4B FP16 model). Increase in Docker Desktop → Settings →
#      Resources → Memory.
#      NVIDIA GPU serving: swap the CPU image for the CUDA image + a GPU
#      reservation (tracked in issue #132).
#
# The Makefile wraps these with `make start` / `make start-local` — see Makefile.

services:

  # --------------------------------------------------------------------------
  # postgres — Relational database. Internal network only: no published ports,
  # unreachable from the host or LAN. The agent reaches it at postgres:5432
  # over the internal bridge. For native `make run` development, the
  # docker-compose.dev.yml overlay publishes 127.0.0.1:5432 (see `make dev-db`).
  # Data persists in the named Docker volume "admino-pgdata" (survives
  # `down`/`up`; not visible in the repo tree — avoids the uid-999 bind-mount
  # permissions footgun on Linux). Reset with `docker volume rm admino-pgdata`.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: admino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: admino
      POSTGRES_USER: admino
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admino -d admino"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # --------------------------------------------------------------------------
  # agent — Python ASGI app. Serves HTTP on port 8000.
  # External access: whitelist-only egress via iptables.
  #   The agent is connected to BOTH networks:
  #     - internal: to reach postgres and the opt-in vllm service
  #     - egress:   for whitelisted external calls (api.infomaniak.com — the
  #                 default LLM — googleapis.com, api.anthropic.com, etc.)
  #   iptables rules in entrypoint.sh enforce the whitelist on the egress interface.
  #   The internal network (172.20.0.0/16) is always permitted by the INTERNAL_NETWORK
  #   rule, so the agent reaches the vllm service without any extra egress rules.
  # --------------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: admino-agent:local
    container_name: admino-agent
    restart: unless-stopped

    # Least-privilege capabilities. Drop everything, then add back only what the
    # root entrypoint needs before it drops to the unprivileged admino user:
    #   NET_ADMIN — apply the iptables egress whitelist (entrypoint.sh)
    #   SETUID/SETGID — let `gosu admino` drop root → admino
    # Without NET_ADMIN the whitelist is skipped with a warning (dev only).
    # no-new-privileges blocks any setuid-binary privilege escalation; it does
    # not affect gosu, which uses setuid(2) to DROP privileges, not gain them.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

    # Bind to localhost only. For LAN/VPN access, change to "0.0.0.0:8000:8000"
    # or use a reverse proxy. Never expose directly on a public interface.
    # Every API call needs a login session. The session cookie is Secure by
    # default, so plain-HTTP access from another address (e.g. a phone on your
    # LAN) also needs COOKIE_SECURE=false in .env.
    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Docker embedded DNS resolver — used by entrypoint.sh to resolve
      # whitelisted hostnames before locking down egress.
      DOCKER_DNS_IP: "127.0.0.11"
      # The internal Docker CIDR the agent may reach WITHOUT going through the
      # iptables egress whitelist (so it can talk to postgres and the vllm service).
      # Must COVER the admino-internal subnet, which is pinned to 172.20.0.0/16
      # (see networks.internal below). 172.16.0.0/12 covers that with room to
      # spare; if you change the pinned subnet, keep it in this range.
      INTERNAL_NETWORK: "172.16.0.0/12"
      # Hard-fail if NET_ADMIN is absent and iptables whitelist cannot be applied.
      # Set to "false" ONLY for local development without Docker privileges.
      # Defaults to "true" for production safety; override via .env file.
      REQUIRE_EGRESS_WHITELIST: "${REQUIRE_EGRESS_WHITELIST:-true}"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: admino
      PG_DATABASE: admino

    volumes:
      # No host user directory is mounted: the container sees only these paths.
      # Audit events and OAuth refresh tokens (Fernet-encrypted) live in
      # PostgreSQL, not on disk.
      # Config is read-only — the agent reads but must never write config files
      - ./config:/app/config:ro

    networks:
      # Internal bridge: communicates with postgres and the vllm service
      - internal
      # Egress bridge: external calls, locked down by iptables in entrypoint.sh
      - egress

    # Resource limits: prevent runaway tool calls from
    # exhausting host memory and triggering the OOM killer.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # --------------------------------------------------------------------------
  # vllm — Local LLM inference (CPU, cross-platform). Opt-in via profile "vllm".
  #
  # Image: vllm/vllm-openai-cpu:latest — multi-arch (linux/amd64 + linux/arm64).
  # Docker auto-pulls the right arch on Apple Silicon and Linux.
  # Exposes an OpenAI-compatible API on :8000 (/v1, /health).
  #
  # Network: internal ONLY. Zero external network access — Docker's `internal:
  # true` bridge blocks all outbound routing at the daemon level, regardless of
  # iptables. The agent reaches it at http://vllm:8000/v1 over the same bridge.
  #
  # Model weights: stored in the `vllm-models` named volume (HF cache layout).
  # Provision once with `make vllm-pull`, then the container serves offline
  # (HF_HUB_OFFLINE=1). No internet access at serve time.
  #
  # Memory: a 4B FP16 model needs ~8 GB of host RAM plus KV cache headroom.
  # Docker Desktop must have ~12–16 GB allocated (Settings → Resources → Memory).
  # No hard memory limit is set here — a Docker-enforced cap below ~10 GB would
  # OOM-kill the container silently. Constrain at the host level instead.
  #
  # Activation: `profiles: ["vllm"]` means bare `docker compose up` — and
  # `make start` / `make docker-up` (default Infomaniak provider) — does NOT pull
  # or start this service. `make start-local` passes --profile vllm to opt in.
  # --------------------------------------------------------------------------
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-cpu:latest}
    container_name: admino-vllm
    profiles:
      - vllm
    restart: unless-stopped
    # Run tini as PID 1 so vLLM's multiprocessing workers (EngineCore, Worker
    # procs) are reaped and SIGTERM is forwarded on shutdown. Without this the
    # container leaves zombie processes and `docker stop` / `compose down` fail
    # with "cannot stop container: ... did not receive an exit event", which
    # otherwise forces a full Docker Desktop restart to clear.
    init: true

    # The vllm-openai-cpu image entrypoint is `python -m vllm.entrypoints.openai.api_server`.
    # Pass model-serving arguments directly.
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      # Enable OpenAI-style function calling — the agent sends tool_choice="auto",
      # which vLLM rejects with HTTP 400 unless BOTH of these are set. The parser
      # must match the model's tool-call format: "hermes" for Qwen3 / Qwen2.5.
      # Override VLLM_TOOL_CALL_PARSER for other families (e.g. llama3_json, mistral).
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${VLLM_TOOL_CALL_PARSER:-hermes}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"

    environment:
      # HuggingFace cache directory — populated by `make vllm-pull`.
      HF_HOME: /models
      # Serve from the local cache only; never attempt internet downloads at runtime.
      # The vllm container is on the internal network (no external access anyway),
      # but this ensures a fast fail rather than a silent hang if weights are missing.
      HF_HUB_OFFLINE: "1"
      # CPU KV-cache space in GB, pre-allocated on top of the model weights.
      # Budget for the ~16 GB Docker VM (the documented minimum): a 4B model is
      # ~7.5 GB of weights plus ~1.5 GB torch/compile overhead, leaving only ~3 GB
      # for the KV cache. The old default of 4 GB did not fit and the engine died
      # at startup with "Available memory ... less than requested memory for kv".
      # 2 GB fits and still holds a full 8K-token context for single-user serving.
      # Raise it (e.g. 4) only after giving Docker Desktop more RAM (~20 GB+).
      VLLM_CPU_KVCACHE_SPACE: "${VLLM_CPU_KVCACHE_SPACE:-2}"

    volumes:
      # HuggingFace model cache, provisioned by `make vllm-pull`.
      # Named volume keeps weights across `down`/`up` cycles.
      - vllm-models:/models

    # Shared memory — required by PyTorch for multiprocessing data loaders.
    shm_size: "2g"

    networks:
      # Internal bridge only — zero external network access.
      # The agent reaches this service at http://vllm:8000/v1.
      - internal

    # The healthcheck uses Python (always present in the image) to avoid a
    # curl dependency. start_period is generous because loading a 4B FP16 model
    # from disk into memory takes several minutes on first start.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

# --------------------------------------------------------------------------
# Networks
#
# `internal` (internal: true): Docker blocks all external routing from this
#   bridge. The vllm service is attached ONLY here — guaranteed zero external
#   access regardless of iptables state.
#
# `egress`: standard bridge with external routing. Only the agent is attached.
#   iptables rules in entrypoint.sh enforce the whitelist so the agent can
#   reach api.anthropic.com, googleapis.com, etc. but nothing else.
# --------------------------------------------------------------------------
networks:
  # Pinned to an explicit subnet INSIDE the egress-allowed range (INTERNAL_NETWORK,
  # 172.16.0.0/12). Without this, Docker assigns the subnet from the daemon's
  # default-address-pool — which on Docker Desktop is often 192.168.x, OUTSIDE
  # 172.16.0.0/12 — so the agent's iptables egress whitelist DROPs traffic to
  # postgres and the agent hangs ~60s then fails with "Database startup failed".
  # Pinning makes the internal subnet deterministic on every host. Change it only
  # if it collides with an existing network; keep it inside INTERNAL_NETWORK.
  internal:
    name: admino-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16

  egress:
    name: admino-egress
    driver: bridge

# --------------------------------------------------------------------------
# Volumes
#
# `pgdata`: named Docker volume for Postgres data, not a host bind-mount.
#   Keeps the repo tree free of uid-999-owned files (Linux bind-mount
#   permissions footgun) and requires no `mkdir` step before first run.
#
# `vllm-models`: named Docker volume for the HuggingFace model cache.
#   Populated once by `make vllm-pull`; survives `down`/`up` cycles.
#   Reset with `docker volume rm admino-vllm-models` (forces re-download).
# --------------------------------------------------------------------------
volumes:
  pgdata:
    name: admino-pgdata
  vllm-models:
    name: admino-vllm-models
