name: CLA Assistant

# Contributor License Agreement enforcement via CLA Assistant Lite.
#
# pull_request_target (rather than pull_request) is required so this check
# runs with a write-capable GITHUB_TOKEN even on pull requests opened from
# forks — CLA signature status must be recorded regardless of who opened the
# PR. This workflow never checks out PR code (no `actions/checkout` of the
# PR ref, no build/test steps), so running in the pull_request_target
# context does not expose repository secrets to untrusted fork code.
#
# Once this repository is public, add "CLAAssistant" (the job name below) as
# a required status check on the `develop` and `main` branch protection
# rules. Branch protection is unavailable on private free-plan repos, so
# this cannot be configured until the repo is made public.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

# contents: write is needed only so the action can commit recorded
# signatures to the dedicated signatures branch (see `branch:` input below).
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # develop is the default branch and the base for all PRs, so the
          # document link is valid as soon as this workflow itself is merged.
          path-to-document: 'https://github.com/ljakupi/admino/blob/develop/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'ljakupi,dependabot[bot]'
