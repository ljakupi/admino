name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'assigned' &&
       github.event.assignee.login == 'claude[bot]') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-20250514"
          allowed_tools: "Bash,Read,Write,Edit,Grep,Glob,TodoWrite"
          direct_prompt: |
            Follow the conventions in CLAUDE.md at the repository root.
            Base all feature branches on the develop branch.
            Use branch naming: {type}/GH-{issue_number}-{short-description}
            Always run make lint, make typecheck, and make test before committing.
            Include "Closes #<issue_number>" in PR descriptions.
