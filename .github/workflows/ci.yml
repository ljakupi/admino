name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # uv must use the Python from actions/setup-python, never download one.
      UV_PYTHON_DOWNLOADS: never
      # Not installed as a package (that would resolve the build backend at
      # build time): the sources are imported straight from src/, which is what
      # scripts/gates.sh does locally.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv is a CI and Docker build-stage tool only. Exact version and wheel
      # hashes live in requirements-uv.txt, shared with the Dockerfile.
      - name: Install uv (pinned, hash-checked)
        run: pip install --require-hashes '--only-binary=:all:' -r requirements-uv.txt
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      # Installs exactly the versions and hashes in uv.lock. Nothing resolves a
      # version range here. --no-install-project: no build backend is resolved.
      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --no-install-project
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Single source of truth: `make check` runs lint, format-check, typecheck,
      # and the coverage-gated test suite (--cov-fail-under=90). The same target
      # is what developers run locally, so CI and local gates cannot drift.
      - name: Quality gates (lint, format-check, typecheck, tests, coverage)
        run: make check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: static-src/package-lock.json
      - name: Install dependencies
        working-directory: static-src
        run: npm ci
      - name: Check translations
        working-directory: static-src
        run: npm run check:i18n
      - name: Type check
        working-directory: static-src
        run: npm run typecheck
      - name: Test
        working-directory: static-src
        run: npm run test
      - name: Build
        working-directory: static-src
        run: npm run build
