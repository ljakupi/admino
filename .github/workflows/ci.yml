name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Format check
        run: make format-check
      - name: Type check
        run: make typecheck
      - name: Test
        run: python -m pytest tests/ -v --tb=short --cov=src/admino --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: static-src/package-lock.json
      - name: Install dependencies
        working-directory: static-src
        run: npm ci
      - name: Type check
        working-directory: static-src
        run: npm run typecheck
      - name: Build
        working-directory: static-src
        run: npm run build
