# admino — Permission Configuration
#
# Every tool action has exactly three states: allow, confirm, deny.
# Unlisted tool/action combinations default to deny.
# Hardcoded denials (*.delete, *.send, *.update on calendars) cannot be
# overridden — setting them to allow/confirm here has no effect and
# will produce a warning at startup.

tools:
  # --- Google ---
  gmail:
    read: allow
    list: allow
    search: allow
    send: deny
    delete: deny

  google_calendar:
    read: allow
    list: allow
    create: confirm
    update: deny
    delete: deny

  google_drive:
    read: allow
    list: allow
    search: allow
    download: confirm
    delete: deny

  # --- Microsoft ---
  outlook:
    read: allow
    list: allow
    search: allow
    send: deny
    delete: deny

  outlook_calendar:
    read: allow
    list: allow
    create: confirm
    update: deny
    delete: deny

  onedrive:
    read: allow
    list: allow
    search: allow
    download: confirm
    delete: deny

  # --- Other ---
  files:
    read: allow
    list: allow
    search: allow
    write: confirm
    move: confirm
    delete: deny

  memory:
    store: allow
    recall: allow
    list: allow
    delete: deny
