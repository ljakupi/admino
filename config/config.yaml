# admino — Application Configuration
#
# This file is validated at startup by Pydantic. The agent refuses to start
# on invalid config with a clear error message.
#
# Secrets (OAUTH_ENCRYPTION_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, AUTH_TOKEN) are NEVER read
# from this file — they come from env vars only.

server:
  host: "0.0.0.0"
  port: 8000

database:
  min_pool_size: 2
  max_pool_size: 5

llm:
  # Provider: "ollama" (default, local), "anthropic" (opt-in), "openai" (opt-in)
  # Proprietary providers send messages to their servers — use only if you accept this trade-off.
  provider: "ollama"

  # Ollama settings (used when provider=ollama)
  # Pick the URL that matches your setup:
  #   Local dev (native Ollama):        "http://localhost:11434"
  #   Docker agent + native Mac:        "http://host.docker.internal:11434"
  #   Docker agent + native Linux:      "http://172.17.0.1:11434"
  #   Full Docker (BACKEND=ollama):     "http://local-llm:11434"
  # Note: in Docker, the .env OLLAMA_BASE_URL override takes precedence over this value.
  ollama_url: "http://localhost:11434"
  model: "gemma4:12b"
  timeout_s: 120

  # Proprietary provider settings — inert while provider is "ollama" above.
  # To opt in to a cloud provider: set ANTHROPIC_API_KEY or OPENAI_API_KEY in the
  # environment (.env for Docker), change llm.provider above, and uncomment the
  # provider's host under egress.allowed_hosts below.
  # WARNING: opt-in means your messages leave your machine and are sent to the
  # provider's servers.
  # Model IDs stay set here (even when inactive) so switching provider later
  # needs no model edit.
  anthropic_model: "claude-sonnet-4-6"
  openai_model: "gpt-4o"

auth:
  # "vpn" = trust all connections (VPN handles auth at network layer). This is the
  #         out-of-the-box default for the localhost-first setup: Docker publishes
  #         the API on 127.0.0.1 only, and local dev (`make run`) serves on your
  #         own machine.
  # "token" = require Bearer token on every request. Switch to this (+ set the
  #           AUTH_TOKEN env var) whenever the API is reachable beyond this
  #           machine (LAN, VPN, VPS).
  mode: "vpn"

paths:
  # Local dev: relative to project root (where you run `make run`).
  # Docker: these are overridden by volume mounts at /app/data/*.
  audit_log: "data/logs/audit.ndjson"

files:
  allowed_paths:
    # Docker: ~/Downloads/admino on the host is mounted at /app/documents.
    # The agent can read and write anything inside that directory.
    # Nothing outside it is accessible — Docker does not mount any other host path.
    # Local dev (make run): change this to an absolute path on your laptop.
    - path: "/app/documents"
      label: "Documents (~/Downloads/admino)"
      access: "readwrite"
  max_read_chars: 10000

limits:
  max_tool_calls_per_message: 10
  max_pending_confirmations: 3
  confirmation_timeout_s: 300
  max_message_length: 4000
  max_context_messages: 20

# Single source of truth for outbound network access: entrypoint.sh derives
# the iptables egress whitelist from this list (Docker mode), and main.py
# checks the configured LLM provider's API host is present at startup.
egress:
  allowed_hosts:
    # Google APIs (Gmail, Calendar, Drive)
    - "oauth2.googleapis.com"
    - "accounts.google.com"
    - "www.googleapis.com"
    - "gmail.googleapis.com"
    # Microsoft Graph API (Outlook, Calendar, OneDrive)
    - "login.microsoftonline.com"
    - "graph.microsoft.com"
    # Uncomment the matching host when llm.provider is anthropic/openai:
    # - "api.anthropic.com"
    # - "api.openai.com"
