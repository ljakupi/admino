# admino — Application Configuration
#
# This file is validated at startup by Pydantic. The agent refuses to start
# on invalid config with a clear error message.
#
# Secrets (OAUTH_ENCRYPTION_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, INFOMANIAK_API_TOKEN,
# ANTHROPIC_API_KEY, OPENAI_API_KEY, SMTP_PASSWORD) are NEVER read from this
# file — they come from env vars only. Transactional email (SMTP_*) is
# configured in the environment too; see .env.example.

server:
  host: "0.0.0.0"
  port: 8000
  # The session cookie's Secure flag. Keep it on: Chrome and Firefox accept
  # Secure cookies on http://localhost too. Only plain-HTTP access from another
  # address (e.g. a phone on the LAN) needs the development-only
  # COOKIE_SECURE=false (see .env.example); it's refused with an https public_url.
  cookie_secure: true
  # The address users open admino at; password reset and invitation links are
  # built from it, and it's the only origin CORS allows. https only (plain http
  # for localhost). Deployments set ADMINO_PUBLIC_URL, which overrides this
  # value (see .env.example).
  public_url: "http://localhost:8000"
  # The reverse proxies whose X-Forwarded-For / X-Forwarded-Proto headers are
  # believed (IP addresses or CIDR ranges). Empty trusts nobody: the client IP
  # used by rate limits and audit events is the connection's peer. The
  # production profile (docker-compose.prod.yml) sets ADMINO_TRUSTED_PROXIES to
  # its Caddy proxy's address, which overrides this value.
  trusted_proxies: []

database:
  min_pool_size: 2
  max_pool_size: 5

llm:
  # Provider: "infomaniak" (default) is Infomaniak AI Services, an
  # OpenAI-compatible API processed in Switzerland; queries are neither recorded
  # nor used for training. Set INFOMANIAK_API_TOKEN (Infomaniak Manager → API
  # tokens, scope `ai-tools`) in the environment; INFOMANIAK_PRODUCT_ID is
  # optional and auto-discovered. Without the token admino still boots and chat
  # replies say the assistant isn't configured yet.
  # "vllm" (opt-in, local) is a first-class, OpenAI-compatible local server that
  # runs as a docker-compose CPU container (Apple Silicon + Linux). Start it with
  # `make start-local` (provisions the model on first run), then set provider to
  # "vllm" here. Until the model finishes loading, chat replies say it is
  # starting or unavailable.
  # "anthropic" and "openai" are cloud opt-ins that send your messages to their
  # servers. Switch to one here and set its API key in the environment.
  # This section is applied at every start. The provider and model IDs are also
  # platform settings: the Super Admin can switch them at runtime with
  # PATCH /api/platform/settings, until the next restart.
  provider: "infomaniak"

  timeout_s: 120
  # Seconds a whole streamed reply may take before it ends with a timeout (0 < x <= 3600).
  stream_deadline_s: 300

  # Infomaniak model ID.
  infomaniak_model: "Qwen/Qwen3.5-397B-A17B-FP8"

  # vLLM (local, opt-in) settings. vllm_model is the served model ID;
  # vllm_base_url is the in-cluster endpoint (the `vllm` compose service on the
  # internal network, no API key needed). vllm_max_model_len is the model's
  # supported context; the container is actually launched with
  # VLLM_MAX_MODEL_LEN (default 8192) to bound CPU KV-cache RAM — raise it if
  # you have the memory.
  vllm_model: "Qwen/Qwen3-4B-Instruct-2507"
  vllm_base_url: "http://vllm:8000/v1"
  vllm_max_model_len: 32768

  # Model IDs for the cloud providers. The chosen provider's API key must be set
  # in the environment (ANTHROPIC_API_KEY or OPENAI_API_KEY) — never in this file.
  # Both IDs stay set so switching to a cloud provider needs no model edit.
  anthropic_model: "claude-sonnet-4-6"
  openai_model: "gpt-4o"

  # The active model's capabilities: the most input tokens it accepts
  # (1000 to 2000000) and whether it accepts images. Like the provider and the
  # model IDs, they are re-applied on every start; the Super Admin edits them
  # in Platform → Defaults until the next restart.
  # The model must fit: max_response_tokens (4096 by default) must be below
  # max_input_tokens minus context.safety_margin_percent of it (rounded up),
  # so at least one input token is left. With the defaults that means
  # max_input_tokens 4553 or more; otherwise admino refuses to start.
  max_input_tokens: 200000
  image_input: true

# Seeds the platform settings on the first start; later edits here don't apply.
limits:
  max_tool_calls_per_message: 10
  max_pending_confirmations: 3
  confirmation_timeout_s: 300
  max_message_length: 4000
  # An optional cap on the messages sent to the model, applied before the
  # token budget below; 0 means no cap (the budget alone decides, and a turn
  # reads the chat's latest 200 messages).
  max_context_messages: 0

# The context budget. Every LLM call must fit llm.max_input_tokens minus a
# safety margin: the instructions, the chat's active attachments, the newest
# whole earlier turns and llm.max_response_tokens kept for the reply. Older
# turns are left out first. The reply's reserve must stay below that budget
# (see llm.max_input_tokens), or admino refuses to start. Read at every
# start; not a platform setting.
# Uncomment the section to change a default.
# context:
#   # Percent of max_input_tokens kept back for estimation error (0 to 50).
#   safety_margin_percent: 10
#   # The most MiB of converted attachment files one turn may read (1 to 1024).
#   max_attachment_mb_per_turn: 64
#   # A tool result above this many tokens is cut, with a marker (256 to 100000).
#   max_tool_result_tokens: 8000

# Single source of truth for outbound network access: entrypoint.sh derives
# the iptables egress whitelist from this list (Docker mode), and main.py
# checks the configured LLM provider's API host is present at startup.
egress:
  allowed_hosts:
    # Google APIs (Gmail, Calendar, Drive)
    - "oauth2.googleapis.com"
    - "accounts.google.com"
    - "www.googleapis.com"
    - "gmail.googleapis.com"
    # Microsoft Graph API (Outlook, Calendar, OneDrive)
    - "login.microsoftonline.com"
    - "graph.microsoft.com"
    # LLM provider APIs. api.infomaniak.com serves the default provider
    # (Infomaniak AI Services, incl. product-ID discovery). api.anthropic.com
    # stays whitelisted so switching to the anthropic cloud opt-in works
    # without an egress edit. The local vllm service needs no egress entry.
    - "api.infomaniak.com"
    - "api.anthropic.com"
    # Uncomment when switching llm.provider to openai:
    # - "api.openai.com"
