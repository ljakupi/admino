# admino — Application Configuration
#
# This file is validated at startup by Pydantic. The agent refuses to start
# on invalid config with a clear error message.
#
# Secrets (OAUTH_ENCRYPTION_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET, AUTH_TOKEN) are NEVER read
# from this file — they come from env vars only.

server:
  host: "0.0.0.0"
  port: 8000

database:
  min_pool_size: 2
  max_pool_size: 5

llm:
  # Provider: "vllm" (default, local) is admino's local-first default — a
  # first-class, OpenAI-compatible local server that runs as a docker-compose
  # service (CPU, cross-platform: Apple Silicon + Linux). Provision the model
  # once with `make vllm-pull`, then `make start` (or `make docker-up`) brings
  # the vllm container up with the rest of the stack. Until the model finishes
  # loading, admino still boots but a chat reply surfaces a friendly
  # "model starting/unavailable" error — it is NOT zero-setup.
  # "anthropic" and "openai" are cloud opt-ins that send your messages to their
  # servers. Switch to one in Settings → Agent (and set its API key) to chat now.
  provider: "vllm"

  timeout_s: 120

  # vLLM (local) settings. vllm_model is the served model ID; vllm_base_url is
  # the in-cluster endpoint (the `vllm` compose service on the internal network,
  # no API key needed). vllm_max_model_len is the model's supported context; the
  # container is actually launched with VLLM_MAX_MODEL_LEN (default 8192) to
  # bound CPU KV-cache RAM — raise it if you have the memory.
  vllm_model: "Qwen/Qwen3-4B-Instruct-2507"
  vllm_base_url: "http://vllm:8000/v1"
  vllm_max_model_len: 32768

  # Model IDs for the cloud providers. The chosen provider's API key must be set
  # in the environment (ANTHROPIC_API_KEY or OPENAI_API_KEY) — never in this file.
  # Both IDs stay set so switching to a cloud provider needs no model edit.
  anthropic_model: "claude-sonnet-4-6"
  openai_model: "gpt-4o"

auth:
  # "vpn" = trust all connections (VPN handles auth at network layer). This is the
  #         out-of-the-box default for the localhost-first setup: Docker publishes
  #         the API on 127.0.0.1 only, and local dev (`make run`) serves on your
  #         own machine.
  # "token" = require Bearer token on every request. Switch to this (+ set the
  #           AUTH_TOKEN env var) whenever the API is reachable beyond this
  #           machine (LAN, VPN, VPS).
  mode: "vpn"

paths:
  # Local dev: relative to project root (where you run `make run`).
  # Docker: these are overridden by volume mounts at /app/data/*.
  audit_log: "data/logs/audit.ndjson"

files:
  allowed_paths:
    # Docker: ~/Downloads/admino on the host is mounted at /app/documents.
    # The agent can read and write anything inside that directory.
    # Nothing outside it is accessible — Docker does not mount any other host path.
    # Local dev (make run): change this to an absolute path on your laptop.
    - path: "/app/documents"
      label: "Documents (~/Downloads/admino)"
      access: "readwrite"
  max_read_chars: 10000

limits:
  max_tool_calls_per_message: 10
  max_pending_confirmations: 3
  confirmation_timeout_s: 300
  max_message_length: 4000
  max_context_messages: 20

# Single source of truth for outbound network access: entrypoint.sh derives
# the iptables egress whitelist from this list (Docker mode), and main.py
# checks the configured LLM provider's API host is present at startup.
egress:
  allowed_hosts:
    # Google APIs (Gmail, Calendar, Drive)
    - "oauth2.googleapis.com"
    - "accounts.google.com"
    - "www.googleapis.com"
    - "gmail.googleapis.com"
    # Microsoft Graph API (Outlook, Calendar, OneDrive)
    - "login.microsoftonline.com"
    - "graph.microsoft.com"
    # LLM provider API — kept whitelisted so switching to the anthropic cloud
    # opt-in works without an egress edit (the default provider is local vllm).
    - "api.anthropic.com"
    # Uncomment when switching llm.provider to openai:
    # - "api.openai.com"
