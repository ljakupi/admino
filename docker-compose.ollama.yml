# admino — Ollama local LLM overlay
#
# Adds an Ollama inference server as the "local-llm" service.
# Merge with the base file to enable it:
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# Or via Make:
#
#   make docker-up BACKEND=ollama
#
# The agent reaches this service at http://local-llm:11434 — set the same
# URL in config.yaml (llm.ollama_url) or via the OLLAMA_BASE_URL env var.
#
# Model download:
#   Because local-llm is on the internal (egress-blocked) network, it cannot
#   pull models from ollama.com at runtime. Either:
#     a) Pre-pull on the host and mount the models dir, or
#     b) Temporarily attach this service to the egress network for the initial
#        `ollama pull` and then remove it.

services:

  # --------------------------------------------------------------------------
  # local-llm (Ollama) — Local OSS inference server.
  # ZERO external network access: attached to the internal bridge only.
  # No ports are published to the host.
  # --------------------------------------------------------------------------
  local-llm:
    # Pin to a specific version — never use :latest in production.
    # Obtain digest with: docker inspect --format='{{index .RepoDigests 0}}' ollama/ollama:0.6.2
    image: ollama/ollama:0.6.2
    restart: unless-stopped

    # Internal network only — no external routing.
    # Port 11434 is intentionally NOT published to the host.
    networks:
      - internal

    volumes:
      - ollama_models:/root/.ollama

    # Resource limits: size depends on the loaded model.
    # 8g covers most 7B-parameter models. Increase for 14B+.
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"

    # Ollama does not need any elevated capabilities
    cap_drop:
      - ALL

    # Use shell-based health check — ollama images may not ship curl.
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /api/tags HTTP/1.0\\r\\n\\r\\n' | nc -w2 localhost 11434 | head -1 | grep -q 200"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

  # Extend the agent so it waits for the local LLM to become healthy.
  agent:
    depends_on:
      local-llm:
        condition: service_healthy

volumes:
  ollama_models:
    name: admino-ollama-models
